{% assign p = include.project %}
<li>
  <div class="card-image">
    {% if p.thumbnail %}<img src="{{ p.thumbnail | relative_url }}" alt="" loading="lazy">{% endif %}
  </div>
  <div class="card-body">
    <h3><a href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
    {% if p.summary %}<p>{{ p.summary }}</p>{% endif %}
    {% if p.engine %}<p class="meta">{{ p.engine }}</p>{% endif %}
  </div>
</li>
