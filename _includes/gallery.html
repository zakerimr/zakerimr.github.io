{% comment %}
  Usage: {% include gallery.html images=page.gallery %}
  Each image: { src: /path.jpg, caption: "Text" }
{% endcomment %}
{% for img in include.images %}
  <figure>
    <img src="{{ img.src | relative_url }}" alt="{{ img.caption | default: '' }}" loading="lazy">
    {% if img.caption %}<figcaption>{{ img.caption }}</figcaption>{% endif %}
  </figure>
{% endfor %}
